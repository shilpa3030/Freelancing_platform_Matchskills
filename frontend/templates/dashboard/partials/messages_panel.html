<div class="container-fluid py-4">
    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card dash-card h-100">
                <div class="card-body d-flex flex-column p-0">
                    <div class="p-3 border-bottom">
                        <h2 class="h6 mb-0">Conversations</h2>
                        <p class="small text-muted mb-0 mt-1">People connected through your project bids.</p>
                    </div>
                    <div id="msg-contact-list" class="list-group list-group-flush flex-grow-1 msg-contact-scroll"></div>
                    <p id="msg-contacts-empty" class="text-muted small p-3 mb-0 d-none">No contacts yet. When you place or receive bids on projects, you can message the other party here.</p>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card dash-card h-100 d-flex flex-column">
                <div class="card-body border-bottom py-3">
                    <h2 class="h6 mb-0" id="msg-thread-title">Select a conversation</h2>
                    <p class="small text-muted mb-0" id="msg-thread-sub"></p>
                </div>
                <div id="msg-thread-body" class="chat-container flex-grow-1 rounded-0 border-0" style="min-height: 360px;"></div>
                <div class="card-body border-top py-3">
                    <form id="msg-form" class="d-flex gap-2 align-items-end">
                        <div class="flex-grow-1">
                            <label class="form-label small mb-1" for="msg-input">Message</label>
                            <textarea class="form-control" id="msg-input" rows="2" placeholder="Write a message…" disabled></textarea>
                        </div>
                        <button type="submit" class="btn btn-fh align-self-end" id="msg-send" disabled>Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
